requestAnimationFrame(function render(now) {
  requestAnimationFrame(render);

  ctx.save();
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const size_x = canvas.width / window.devicePixelRatio;
  const size_y = canvas.height / window.devicePixelRatio;

  ctx.fillStyle = "snow";
  ctx.fillRect(0, 0, size_x, size_y);

  {
    /* vertical blue lines */
    ctx.fillStyle = "rgba(201, 211, 217, 1.0)";
    for (let x = 200; x < size_x; x += 150)
      ctx.fillRect(x, 0, 3, size_y);

    /* horizontal red line */
    ctx.fillStyle = "rgba(196, 146, 166, 1.0)";
    ctx.fillRect(0, size_y*(1 - 0.155), size_x, 5);

    {
      ctx.save();
      ctx.translate(200, 200);
      ctx.beginPath();
      const frame_duration = 1000 / 24;
      const frame_idx = Math.floor(now/frame_duration) % stickwalk.frames.length;
      const frame_t = (now/frame_duration) - Math.floor(now/frame_duration);
      const bone_at = bone => {
        const next_frame = stickwalk.frames[(frame_idx + 1) % stickwalk.frames.length];
        return {
          y: lerp(stickwalk.frames[frame_idx].bones[bone].y, next_frame.bones[bone].y, frame_t),
          z: lerp(stickwalk.frames[frame_idx].bones[bone].z, next_frame.bones[bone].z, frame_t),
        };
      };

      for (const [from, to] of stickwalk.connections) {
        ctx.moveTo(-bone_at(from).y*80, -bone_at(from).z*60);
        ctx.lineTo(-bone_at(  to).y*80, -bone_at(  to).z*60);
      }
      ctx.strokeStyle = "black";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.closePath();

      ctx.fillStyle = "black";
      ctx.arc(-bone_at("Head").y*80, -(bone_at("Head").z*50 + 22), 15, 0, Math.PI*2);
      ctx.fill();

      ctx.restore();
    }
  }
  ctx.restore();
})

function lerp(v0, v1, t) { return (1 - t) * v0 + t * v1; }
function inv_lerp(min, max, p) { return (p - min) / (max - min); }
